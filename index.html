<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>
          TO DO LIST MAMBA <img src="image/note-icon.png" alt="note-icon" />
        </h1>
        <div class="row">
          <input type="text" id="input-box" placeholder="Masukkan teks" />
          <button id="btn">Tambah</button>
        </div>
        <div class="stats">
          <p>Total Tugas: <span id="total-tugas">0</span></p>
          <p>Selesai: <span id="selesai">0</span></p>
          <p>Belum Selesai: <span id="belum-selesai">0</span></p>
        </div>

        <ul id="list-container">
          <!-- <li class="checked">To Do 1</li>
            <li>To Do 2</li>
            <li>To Do 3</li> -->
        </ul>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
